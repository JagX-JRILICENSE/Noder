name: Build Windows App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows application
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Avoid code-signing failures on open-source builds

      - name: List release folder
        if: always()
        run: |
          if (Test-Path release) { Get-ChildItem -Recurse release } else { Write-Host "No release folder" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 14

name: Build Windows App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          # Optional native modules (node-pty) must not fail the install
          npm_config_optional: true

      - name: Build renderer
        run: npx vite build

      - name: Package Windows app
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: List release output
        if: always()
        run: |
          Write-Host "=== release folder ==="
          if (Test-Path release) {
            Get-ChildItem -Recurse release | Format-Table Name, Length, LastWriteTime
          } else {
            Write-Host "No release folder created"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-Windows-v${{ github.run_number }}
          path: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: warn
          retention-days: 30

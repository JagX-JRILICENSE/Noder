name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow + generate icons
        run: |
          python -m pip install --upgrade pip pillow
          python scripts/generate-icons.py

      - name: Verify icons
        shell: bash
        run: |
          test -f assets/icon.png || test -f assets/icon.ico || (echo "Missing icons" && exit 1)

      - name: npm install
        run: npm install --no-audit --no-fund
        env:
          npm_config_optional: true

      - name: Vite build
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Verify dist
        shell: bash
        run: |
          test -d dist
          test -f dist-electron/main.js || test -f dist-electron/main.cjs || ls -la dist-electron || true

      - name: Electron Builder (Windows x64)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: List release output
        shell: bash
        run: find release -type f 2>/dev/null | head -40 || dir release /s /b 2>nul || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-Windows-${{ github.sha }}
          path: |
            release/**/*.exe
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: warn
          retention-days: 30

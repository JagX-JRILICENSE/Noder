name: Build Windows App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit --no-fund
        continue-on-error: false

      - name: Ensure assets folder exists
        run: |
          if (-not (Test-Path assets)) { New-Item -ItemType Directory -Path assets | Out-Null }
          # Create a minimal placeholder icon if missing so electron-builder does not fail hard
          if (-not (Test-Path assets/icon.ico)) {
            Write-Host "No icon.ico found — build will use default Electron icon"
          }

      - name: Build renderer + package Windows app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      - name: List release output
        if: always()
        run: |
          Write-Host "=== release folder ==="
          if (Test-Path release) {
            Get-ChildItem -Recurse release | Format-Table Name, Length, LastWriteTime
          } else {
            Write-Host "No release folder created"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-Windows-v${{ github.run_number }}
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/*.zip
          if-no-files-found: warn
          retention-days: 30

name: Build All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: macos-latest
            platform: mac
            args: --mac --arm64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pillow
      - run: python scripts/generate-icons.py
      - name: Verify icons
        shell: bash
        run: |
          test -f assets/icon.png || test -f assets/icon.ico || exit 1
      - name: Linux deps
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm
      - run: npm install --no-audit --no-fund
        env:
          npm_config_optional: true
      - run: npx vite build
        env:
          NODE_ENV: production
      - name: Verify build
        shell: bash
        run: |
          test -d dist && (test -f dist-electron/main.js || test -f dist-electron/main.cjs)
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-${{ matrix.platform }}-${{ github.sha }}
          path: release/**
          if-no-files-found: warn
          retention-days: 30

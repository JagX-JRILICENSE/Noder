name: Build Android APK + AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Capacitor 8 / AGP need JDK 21 (source release 21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install SDK platforms + build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" "build-tools;34.0.0" "platform-tools" || true

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/preferences --no-audit --no-fund

      - name: Vite web build
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Capacitor config
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            printf '%s\n' '{"appId":"com.jagx.noder","appName":"Noder","webDir":"dist","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}' > capacitor.config.json
          fi
          mkdir -p dist
          test -f dist/index.html || printf '%s\n' '<!DOCTYPE html><html><body><h1>Noder</h1></body></html>' > dist/index.html

      - name: Add Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Scaffolding android platform"
            rm -rf android
            npx cap add android
          fi
          npx cap sync android
          test -f android/gradlew
          chmod +x android/gradlew
          # Ensure Java 21 is used by Gradle
          if [ -f android/gradle.properties ]; then
            grep -q org.gradle.java.home android/gradle.properties || true
          fi
          java -version

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Bundle Release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Assemble Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Collect outputs
        run: |
          mkdir -p android-out
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp -v {} android-out/ \; || true
          ls -lah android-out/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: Noder-Android-${{ github.sha }}
          path: android-out/**
          if-no-files-found: warn
          retention-days: 30

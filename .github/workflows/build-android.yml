name: Build Android APK + AAB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: npm install (app)
        run: npm install --no-audit --no-fund

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/preferences --no-audit --no-fund

      - name: Build web (Vite)
        run: npx vite build
        env:
          NODE_ENV: production

      - name: Ensure capacitor.config
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.jagx.noder",
            "appName": "Noder",
            "webDir": "dist",
            "server": { "androidScheme": "https" },
            "android": { "allowMixedContent": true }
          }
          EOF
          fi
          test -d dist || mkdir -p dist
          test -f dist/index.html || echo '<!DOCTYPE html><html><body><h1>Noder</h1></body></html>' > dist/index.html

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make gradlew executable
        run: |
          chmod +x android/gradlew || true
          ls -la android/

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Build Release APK (unsigned)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Build Release AAB (unsigned)
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace || true

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p android-out
          find android -name "*.apk" -type f -exec cp -v {} android-out/ \; || true
          find android -name "*.aab" -type f -exec cp -v {} android-out/ \; || true
          ls -la android-out/ || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Noder-Android-${{ github.sha }}
          path: |
            android-out/**
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
          if-no-files-found: warn
          retention-days: 30
